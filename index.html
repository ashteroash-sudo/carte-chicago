<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte de terrain</title>
<style>
  :root{
    --bg-deep:#0f0d0a;
    --bg-panel:#1b1712;
    --bg-panel-2:#231d16;
    --ink:#5a4a30;
    --blood:#8a1f1f;
    --blood-bright:#c62828;
    --cream:#ece3cc;
    --muted:#9c8f74;
    --gold:#a8863f;
    --card:#f2ead6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg-deep);
    color:var(--cream);
    font-family:Georgia,'Times New Roman',serif;
    overflow:hidden;
  }
  #app{ position:relative; width:100%; height:100vh; display:flex; flex-direction:column; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px;
    background:linear-gradient(180deg,var(--bg-panel-2),var(--bg-panel));
    border-bottom:1px solid #000;
    box-shadow:0 2px 10px rgba(0,0,0,.5);
    z-index:20;
  }
  header h1{ margin:0; font-size:22px; letter-spacing:1px; font-weight:400; color:var(--cream); }
  header h1 span{ color:var(--blood-bright); }

  /* ---- Bascule entre villes ---- */
  #villes{ display:flex; border:1px solid var(--gold); }
  #villes button{
    font-family:'Courier New',monospace;
    background:var(--bg-panel); border:0; color:var(--gold);
    padding:9px 18px; font-size:13px; letter-spacing:.5px; cursor:pointer;
  }
  #villes button + button{ border-left:1px solid var(--gold); }
  #villes button:hover{ background:#2a2218; }
  #villes button[aria-pressed="true"]{ background:var(--gold); color:#1b1712; }
  #villes button:focus-visible{ outline:2px solid var(--cream); outline-offset:2px; }

  #main{ position:relative; flex:1; display:flex; overflow:hidden; }
  #map-wrap{
    flex:1; position:relative; display:flex; align-items:center; justify-content:center;
    background:var(--bg-deep); overflow:hidden; padding:1vh 1vw;
  }
  #map-wrap svg{
    max-height:100%; max-width:100%;
    filter:drop-shadow(0 10px 40px rgba(0,0,0,.7));
  }
  .hood{ fill:rgba(255,255,255,0); stroke:none; cursor:pointer; }
  .hood:hover{ fill:rgba(255,255,255,0.12); }

  /* ---- Cartes hors-cadre (ex. Waukegan) ---- */
  .hors-carte{
    position:absolute; right:36px; top:50%; transform:translateY(-50%) rotate(-3deg);
    width:420px;
    background:var(--card); color:#241d12; border:3px solid var(--blood);
    padding:28px 32px 32px;
    box-shadow:0 16px 46px rgba(0,0,0,.6), 0 0 0 10px rgba(138,31,31,0.08);
    cursor:pointer;
    font-family:'Courier New',monospace; z-index:15; transition:transform .15s;
  }
  .hors-carte:hover{ transform:translateY(-50%) rotate(-1deg) scale(1.04); }
  .hors-carte .tag{ font-size:18px; letter-spacing:.5px; color:var(--blood); border-bottom:1px dashed var(--ink); padding-bottom:10px; margin-bottom:14px; }
  .hors-carte .name{ font-family:Georgia,serif; font-size:44px; color:#241d12; }
  .hors-carte .dist{ font-size:20px; color:#5a4a30; margin-top:8px; }

  #toast{
    position:absolute; bottom:26px; left:26px;
    background:var(--bg-panel); border:1px solid var(--ink); color:var(--muted);
    font-family:'Courier New',monospace; font-size:12px; padding:9px 16px;
    display:none; z-index:15;
  }
  #toast.show{ display:block; }

  /* ---- Panneau : collage en vrac ---- */
  #panel-overlay{
    position:fixed; inset:0; background:rgba(5,4,3,.8);
    display:none; align-items:center; justify-content:center; z-index:40;
    overflow:auto; padding:30px;
  }
  #panel-overlay.show{ display:flex; }
  #panel{
    position:relative;
    width:1900px; max-width:98vw;
    height:1300px; max-height:96vh;
  }
  #panel-close{
    position:absolute; top:-6px; right:-6px;
    background:var(--bg-panel); border:1px solid var(--muted); color:var(--cream);
    width:32px; height:32px; cursor:pointer; font-size:16px;
    font-family:'Courier New',monospace; z-index:60; border-radius:50%;
  }
  #panel-close:hover{ border-color:var(--cream); }

  .collage-photo{
    position:absolute;
    width:640px; height:470px;
    object-fit:cover;
    border:12px solid #fff;
    box-shadow:0 20px 50px rgba(0,0,0,.55);
    background:#111;
  }
  .center-card{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%) rotate(-1.2deg);
    width:1000px; max-width:90%;
    background:var(--card);
    color:#241d12;
    padding:56px 64px;
    box-shadow:0 26px 60px rgba(0,0,0,.6);
    z-index:30;
    border:2px solid #b7a877;
  }
  .center-card .sub{
    font-family:'Courier New',monospace; font-size:22px; letter-spacing:.5px;
    color:var(--blood); margin-bottom:14px;
  }
  .center-card h2{ margin:0 0 24px; font-size:64px; font-weight:400; color:#241d12; }
  .center-card p{ margin:0; font-size:32px; line-height:1.6; color:#3a2f1c; }
  .center-card p + p{ margin-top:.7em; }
  .pin-icon{
    position:absolute; top:-16px; left:50%; transform:translateX(-50%);
    width:34px; height:34px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e05a5a, var(--blood));
    box-shadow:0 5px 10px rgba(0,0,0,.5);
    z-index:31;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="titre">Carte <span>— de terrain</span></h1>
    <div id="villes" role="group" aria-label="Choisir la ville">
      <button data-ville="chicago" aria-pressed="false">Chicago</button>
      <button data-ville="gary" aria-pressed="false">Gary</button>
    </div>
  </header>

  <div id="main">
    <div id="map-wrap">
      <svg id="map-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="toast">Terrain neutre — pas encore exploré.</div>
  </div>
</div>

<div id="panel-overlay">
  <div id="panel">
    <button id="panel-close" aria-label="Fermer">✕</button>
    <div id="panel-inner" style="position:relative;width:100%;height:100%;"></div>
  </div>
</div>

<script>
/*
  ORGANISATION DES FICHIERS
  <ville>/carte.json      contours des zones + nom du dossier de chaque zone
  <ville>/fond.jpg        image de fond
  <ville>/<dossier>/texte.txt   ligne 1 = titre, ligne 2 = sous-titre, le reste = description
  <ville>/<dossier>/1.jpg … 6.jpg   photos du collage (6 max)

  Une zone est "active" dès que son dossier contient un texte.txt.
  Rien à modifier dans ce fichier pour ajouter un quartier.
*/
const VILLES = ['chicago', 'gary'];
const EXTENSIONS = ['jpg', 'jpeg', 'png', 'webp', 'JPG', 'JPEG', 'PNG'];
const MAX_PHOTOS = 6;

const svg = document.getElementById('map-svg');
const mainEl = document.getElementById('main');
let villeCourante = null;

// ---- Choix de la ville ----
function villeDeDepart(){
  const h = location.hash.replace('#', '').toLowerCase();
  if (VILLES.includes(h)) return h;
  try {
    const v = localStorage.getItem('carte-ville');
    if (VILLES.includes(v)) return v;
  } catch (e) {}
  return 'chicago';
}

document.querySelectorAll('#villes button').forEach(b => {
  b.addEventListener('click', () => chargerVille(b.dataset.ville));
});

async function chargerVille(ville){
  if (ville === villeCourante) return;
  fermerPanneau();
  let carte;
  try {
    const r = await fetch(`${ville}/carte.json`, { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    carte = await r.json();
  } catch (e) {
    afficherToast(`Impossible de charger ${ville}/carte.json`);
    return;
  }
  villeCourante = ville;
  try { localStorage.setItem('carte-ville', ville); } catch (e) {}
  history.replaceState(null, '', '#' + ville);

  document.querySelectorAll('#villes button').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.ville === ville ? 'true' : 'false');
  });
  document.getElementById('titre').innerHTML =
    `${carte.titre} <span>— ${carte.sousTitre}</span>`;
  document.title = `${carte.titre} — ${carte.sousTitre}`;

  dessinerCarte(ville, carte);
  dessinerHorsCarte(ville, carte.horsCarte || []);
}

function dessinerCarte(ville, carte){
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${carte.width} ${carte.height}`);
  svg.setAttribute('width', carte.width);
  svg.setAttribute('height', carte.height);

  const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
  img.setAttribute('href', `${ville}/${carte.fond}`);
  img.setAttribute('x', 0); img.setAttribute('y', 0);
  img.setAttribute('width', carte.width); img.setAttribute('height', carte.height);
  img.setAttribute('preserveAspectRatio', 'xMidYMid slice');
  svg.appendChild(img);

  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  svg.appendChild(g);
  carte.zones.forEach(z => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', z.d);
    p.setAttribute('class', 'hood');
    p.addEventListener('click', () => ouvrirZone(ville, z.dossier));
    g.appendChild(p);
  });
}

function dessinerHorsCarte(ville, liste){
  document.querySelectorAll('.hors-carte').forEach(el => el.remove());
  liste.forEach(h => {
    const c = document.createElement('div');
    c.className = 'hors-carte';
    c.innerHTML = `<div class="tag"></div><div class="name"></div><div class="dist"></div>`;
    c.querySelector('.tag').textContent = h.tag || 'HORS-CARTE';
    c.querySelector('.name').textContent = h.nom;
    c.querySelector('.dist').textContent = h.dist || '';
    c.addEventListener('click', () => ouvrirZone(ville, h.dossier));
    mainEl.appendChild(c);
  });
}

// ---- Message en bas à gauche ----
let toastTimer = null;
function afficherToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg || 'Terrain neutre — pas encore exploré.';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---- Ouverture d'une zone ----
async function ouvrirZone(ville, dossier){
  const base = `${ville}/${dossier}`;
  let brut;
  try {
    const r = await fetch(`${base}/texte.txt`, { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    brut = await r.text();
  } catch (e) {
    afficherToast();
    return;
  }
  const lignes = brut.replace(/^\uFEFF/, '').replace(/\r/g, '').split('\n');
  const titre = (lignes[0] || '').trim();
  const sous = (lignes[1] || '').trim();
  const paragraphes = lignes.slice(2).join('\n').split(/\n\s*\n/)
    .map(p => p.trim()).filter(Boolean);

  const inner = document.getElementById('panel-inner');
  inner.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'center-card';
  card.innerHTML = `<div class="pin-icon"></div><div class="sub"></div><h2></h2>`;
  card.querySelector('.sub').textContent = sous;
  card.querySelector('h2').textContent = titre;
  paragraphes.forEach(t => {
    const p = document.createElement('p');
    p.textContent = t;
    card.appendChild(p);
  });
  inner.appendChild(card);
  document.getElementById('panel-overlay').classList.add('show');

  const photos = await Promise.all(
    Array.from({ length: MAX_PHOTOS }, (_, i) => trouverPhoto(`${base}/${i + 1}`))
  );
  // si on a changé de zone entre-temps, ne rien ajouter
  if (!inner.contains(card)) return;
  photos.filter(Boolean).forEach((src, i) => placerPhoto(inner, src, i));
}

function trouverPhoto(sansExtension){
  return new Promise(resolve => {
    let i = 0;
    const essai = () => {
      if (i >= EXTENSIONS.length) return resolve(null);
      const src = `${sansExtension}.${EXTENSIONS[i++]}`;
      const im = new Image();
      im.onload = () => resolve(src);
      im.onerror = essai;
      im.src = src;
    };
    essai();
  });
}

const LAYOUT = [
  {top:'0%',  left:'0%',  rot:-7, z:10},
  {top:'0%',  left:'58%', rot:6,  z:11},
  {top:'32%', left:'-3%', rot:5,  z:12},
  {top:'36%', left:'64%', rot:-5, z:13},
  {top:'66%', left:'4%',  rot:-9, z:10},
  {top:'64%', left:'56%', rot:8,  z:11},
];
function placerPhoto(inner, src, i){
  const L = LAYOUT[i % LAYOUT.length];
  const im = document.createElement('img');
  im.src = src;
  im.alt = '';
  im.className = 'collage-photo';
  im.style.top = L.top; im.style.left = L.left;
  im.style.transform = `rotate(${L.rot}deg)`;
  im.style.zIndex = L.z;
  inner.appendChild(im);
}

function fermerPanneau(){
  document.getElementById('panel-overlay').classList.remove('show');
}
document.getElementById('panel-close').addEventListener('click', fermerPanneau);
document.getElementById('panel-overlay').addEventListener('click', e => {
  if (e.target.id === 'panel-overlay') fermerPanneau();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') fermerPanneau(); });

chargerVille(villeDeDepart());
</script>
</body>
</html>
